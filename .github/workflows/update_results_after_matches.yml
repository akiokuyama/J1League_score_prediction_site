name: Update 2026-27 J1 Results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"  # Mon 07:00 JST

permissions:
  contents: write

concurrency:
  group: j1-2026-27-data-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and verify code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app src scripts
          python -m pytest
      - name: Capture prediction output baseline
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          targets = [
              Path("outputs/latest_predictions.json"),
              Path("outputs/all_unplayed_predictions.json"),
              Path("outputs/prediction_history"),
          ]
          def digest(path):
              if not path.exists():
                  return "missing"
              if path.is_dir():
                  return str(len(list(path.glob("*.json"))))
              return hashlib.sha256(path.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for index, target in enumerate(targets):
                  env.write(f"PREDICTION_BASELINE_{index}={digest(target)}\n")
          PY
      - name: Update official match results only
        run: |
          python scripts/update_competition_data.py --competition-key 2026_27_j1 --scope results
          python scripts/build_past_prediction_results.py \
            --matches Data/processed/matches_2026_27_j1_clean.csv
          python scripts/validate_past_prediction_results.py
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          targets = [
              Path("outputs/latest_predictions.json"),
              Path("outputs/all_unplayed_predictions.json"),
              Path("outputs/prediction_history"),
          ]
          def digest(path):
              if not path.exists():
                  return "missing"
              if path.is_dir():
                  return str(len(list(path.glob("*.json"))))
              return hashlib.sha256(path.read_bytes()).hexdigest()
          for index, target in enumerate(targets):
              current = digest(target)
              expected = os.environ[f"PREDICTION_BASELINE_{index}"]
              if current != expected:
                  raise SystemExit(f"prediction output changed unexpectedly: {target}")
          PY
      - name: Commit result data without changing predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp_dir="$(mktemp -d)"
          for target in Data/processed/matches_2026_27_j1_clean.csv Data/processed/update_2026_27_j1_report.json outputs/past_prediction_results.json; do
            [ -e "$target" ] && mkdir -p "$tmp_dir/$(dirname "$target")" && cp -a "$target" "$tmp_dir/$target"
          done
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          (cd "$tmp_dir" && tar -cf - .) | tar -xf -
          git add Data/processed/matches_2026_27_j1_clean.csv Data/processed/update_2026_27_j1_report.json outputs/past_prediction_results.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update 2026-27 J1 results"
            git push
          fi
