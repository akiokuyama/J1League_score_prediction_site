<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102a43">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="2026/27シーズンのJ1試合予測・勝敗確率・最終順位予測を確認できるPWAです。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="J1予測AI">
    <title>J1試合予想AI</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="icon" href="./icons/icon-192.png">
    <script src="../analytics.js"></script>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("j1_prediction_theme_v1");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch {
          // 保存領域を利用できない場合は端末設定に合わせます。
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=6">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">2026/27 明治安田J1リーグ</p>
          <h1>J1試合予想AI</h1>
        </div>
        <button id="install-button" class="icon-button install-button" type="button" hidden aria-label="アプリをインストール">
          <span aria-hidden="true">↓</span>
        </button>
      </header>

      <div id="connection-banner" class="connection-banner" hidden>
        オフラインです。最後に取得したデータを表示しています。
      </div>

      <section id="status-card" class="status-card" aria-live="polite">
        <div class="status-dot"></div>
        <div>
          <strong id="status-title">予測データを読み込んでいます</strong>
          <span id="status-detail">しばらくお待ちください</span>
        </div>
      </section>

      <section id="my-team-banner" class="my-team-banner" hidden>
        <div id="my-team-identity" class="team-identity"></div>
        <button id="change-team-button" class="text-button" type="button">変更</button>
      </section>

      <main id="app-content" tabindex="-1">
        <section class="loading-panel">
          <div class="loading-mark">⚽</div>
          <h2>予測データを準備中</h2>
          <p>最新の試合予測と順位予測を読み込んでいます。</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button class="nav-item is-active" type="button" data-view="upcoming">
          <span class="nav-icon" aria-hidden="true">◷</span>
          <span>これから</span>
        </button>
        <button class="nav-item" type="button" data-view="past">
          <span class="nav-icon" aria-hidden="true">✓</span>
          <span>過去結果</span>
        </button>
        <button class="nav-item" type="button" data-view="standings">
          <span class="nav-icon" aria-hidden="true">≡</span>
          <span>順位予測</span>
        </button>
        <button class="nav-item" type="button" data-view="settings">
          <span class="nav-icon" aria-hidden="true">⚙</span>
          <span>設定</span>
        </button>
      </nav>
    </div>

    <dialog id="team-dialog" class="app-dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">最初に設定</p>
            <h2>マイチームを選択</h2>
          </div>
          <button class="icon-button" type="submit" value="cancel" aria-label="閉じる">×</button>
        </div>
        <p class="dialog-copy">次回から、選んだクラブの試合を最初に表示します。設定はいつでも変更できます。</p>
        <div id="team-options" class="team-options"></div>
      </form>
    </dialog>

    <dialog id="match-dialog" class="app-dialog match-dialog">
      <div id="match-detail"></div>
      <form method="dialog">
        <button class="secondary-button full-width" type="submit">一覧に戻る</button>
      </form>
    </dialog>

    <dialog id="install-dialog" class="app-dialog install-dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">アプリとして利用</p>
            <h2>ホーム画面に追加</h2>
          </div>
          <button class="icon-button" type="submit" value="cancel" aria-label="閉じる">×</button>
        </div>
        <div id="install-instructions"></div>
        <button id="install-dialog-action" class="primary-button full-width" type="button" hidden>
          ホーム画面に追加
        </button>
        <button class="secondary-button full-width" type="submit">閉じる</button>
      </form>
    </dialog>

    <template id="empty-state-template">
      <section class="empty-state">
        <div class="empty-icon">⚽</div>
        <h2>表示できる試合がありません</h2>
        <p>条件を変更するか、データが更新されるまでお待ちください。</p>
      </section>
    </template>

    <script type="module" src="./app.js?v=9"></script>
  </body>
</html>
